# Integración de `musica` con Kitty → copiar a ~/.config/kitty/musica.conf
# y agregar al final de ~/.config/kitty/kitty.conf la línea:   include musica.conf
#
# Después reiniciá Kitty (cerrar y abrir): la barra de pestañas propia solo se carga al arrancar.

# ---- Barra de pestañas propia (tab_bar.py): pestañas redondeadas + lo que suena a la derecha
tab_bar_style         custom
tab_bar_min_tabs      1
tab_bar_margin_height 4.0 2.0

# ---- Atajos para la música puesta de fondo (`musica -b ...`)
# Si Kitty no encuentra `musica` (no está en el PATH con el que arranca Kitty), poné la ruta completa,
# por ejemplo /home/TU_USUARIO/.local/bin/musica
map alt+shift+space launch --type=background musica ctl toggle
map alt+shift+n     launch --type=background musica ctl next
map alt+shift+p     launch --type=background musica ctl prev
map alt+shift+k     launch --type=background musica ctl vol +5
map alt+shift+j     launch --type=background musica ctl vol -5
map alt+shift+s     launch --type=background musica ctl stop
